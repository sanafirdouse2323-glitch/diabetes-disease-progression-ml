name: Repeated-seed classical validation

on:
  push:
    branches: [main]
    paths:
      - "src/diabetes_ml/repeated_validation.py"
      - "src/diabetes_ml/data.py"
      - "src/diabetes_ml/models.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/repeated-validation.yml"
  pull_request:
    paths:
      - "src/diabetes_ml/repeated_validation.py"
      - "src/diabetes_ml/data.py"
      - "src/diabetes_ml/models.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/repeated-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core dependencies
        run: uv sync --locked --no-build-isolation-package diabetes-ml --python 3.11 --extra build
      - name: Run ten-seed classical validation
        run: uv run --locked python -m diabetes_ml.repeated_validation --output repeated-validation-results
      - name: Run ten-seed matched-sample classical validation
        run: uv run --locked python -m diabetes_ml.repeated_validation --output repeated-validation-matched-results --val-fraction 0.20
      - name: Upload repeated-seed metrics
        uses: actions/upload-artifact@v4
        with:
          name: repeated-seed-classical-validation
          path: |
            repeated-validation-results/
            repeated-validation-matched-results/
          if-no-files-found: error
          retention-days: 30
