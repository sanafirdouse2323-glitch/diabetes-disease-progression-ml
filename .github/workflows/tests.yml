name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest
      - name: Run experiment smoke test
        run: python -m diabetes_ml.experiment --output ci-results
      - name: Run repeated-seed validation smoke test
        run: python -m diabetes_ml.repeated_validation --output repeated-ci-results --seeds 42 43 44 --cv-folds 3 --val-fraction 0.20
