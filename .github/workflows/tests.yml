name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core, test, and demo dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra demo
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Run test suite
        run: uv run --locked pytest -v
      - name: Run classical experiment smoke test
        run: uv run --locked python -m diabetes_ml.experiment --output ci-results
      - name: Run repeated-seed validation smoke test
        run: uv run --locked python -m diabetes_ml.repeated_validation --output repeated-ci-results --seeds 42 43 44 --cv-folds 3 --val-fraction 0.20
