name: Neural framework checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  neural-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked neural and test dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra neural
      - name: Run neural-specific tests
        run: >-
          uv run --locked pytest -q
          tests/test_neural_data.py
          tests/test_pytorch_model.py
          tests/test_tensorflow_model.py
          tests/test_repeated_neural_validation.py
          tests/test_repeated_neural_tuning.py
      - name: Run end-to-end conventional and neural comparison
        run: uv run --locked python -m diabetes_ml.neural.neural_experiment --output neural-ci-results --epochs 100 --patience 12
      - name: Run repeated-neural validation smoke test
        run: uv run --locked python -m diabetes_ml.repeated_neural_validation --output repeated-neural-ci-results --seeds 42 43 --epochs 10 --patience 3
      - name: Upload measured metrics and training history
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-neural-experiment-results
          path: neural-ci-results/
          if-no-files-found: error
          retention-days: 14
