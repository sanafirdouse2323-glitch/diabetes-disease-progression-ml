name: Docker image smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --pull --tag diabetes-progression-demo:ci .

      - name: Start demo container
        run: docker run --detach --name diabetes-progression-demo --publish 8501:8501 --cap-drop=ALL --security-opt=no-new-privileges diabetes-progression-demo:ci

      - name: Verify non-root runtime identity
        run: test "$(docker exec diabetes-progression-demo id -u)" = "10001"

      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit health endpoint is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs diabetes-progression-demo
          exit 1

      - name: Check HTTP page response
        run: curl --fail --silent --show-error http://127.0.0.1:8501/ > /dev/null

      - name: Stop demo container
        if: always()
        run: docker rm --force diabetes-progression-demo || true
