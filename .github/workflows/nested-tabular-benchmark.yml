name: Nested tabular benchmark

on:
  pull_request:
    paths:
      - "src/diabetes_ml/nested_tabular_benchmark.py"
      - "src/diabetes_ml/data.py"
      - "tests/test_nested_tabular_benchmark.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/nested-tabular-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked core dependencies
        run: uv sync --locked --no-build-isolation-package diabetes-ml --python 3.11 --extra build
      - name: Run nested repeated-CV benchmark
        run: uv run --locked python -m diabetes_ml.nested_tabular_benchmark --output nested-tabular-benchmark
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: nested-tabular-benchmark-results
          path: nested-tabular-benchmark/
          if-no-files-found: error
          retention-days: 30
