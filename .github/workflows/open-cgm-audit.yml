name: Open CGM data acquisition and quality audit

on:
  push:
    branches:
      - research/mimic-iv-glycemic-trajectory
    paths:
      - .github/workflows/open-cgm-audit.yml
      - src/diabetes_ml/cgm_audit.py
      - tests/test_cgm_audit.py
  workflow_dispatch:

concurrency:
  group: open-cgm-acquisition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install audit and upstream harmonization dependencies
        run: python -m pip install --upgrade pip pandas numpy requests openpyxl python-calamine pytest
      - name: Test the aggregate-only audit
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_cgm_audit.py
      - name: Clone the upstream Glucose-ML tools
        run: git clone --depth 1 https://github.com/Augmented-Health-Lab/Glucose-ML-Project.git upstream-glucose-ml
      - name: Download only the first-batch open datasets
        working-directory: upstream-glucose-ml/1_Auto-scripts
        run: |
          printf 'y\n' | python auto-download-open-datasets.py shanghai bris-t1d_open
      - name: Harmonize ShanghaiT2DM and Bris-T1D Open CGM files
        working-directory: upstream-glucose-ml
        run: |
          python 2_Harmonize-cgm-datasets/ShanghaiT2DM/ShanghaiT2DM_extract-glucose-data.py 1_Auto-scripts/Original-Glucose-ML-datasets/Shanghai_raw_data/Shanghai_T2DM
          python 2_Harmonize-cgm-datasets/Bris-T1D_Open/Bris-T1D_Open_extract-glucose-data.py 1_Auto-scripts/Original-Glucose-ML-datasets/Bris-T1D_Open_raw_data
      - name: Audit original Shanghai workbooks without merging recording sessions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m diabetes_ml.cgm_source_audit \
            --raw-dir upstream-glucose-ml/1_Auto-scripts/Original-Glucose-ML-datasets/Shanghai_raw_data/Shanghai_T2DM \
            --harmonized-dir upstream-glucose-ml/Standardized-datasets/ShanghaiT2DM \
            --upstream-revision "$(git -C upstream-glucose-ml rev-parse HEAD)" \
            --output cgm-audit-summary/shanghai-source-audit.json
      - name: Run aggregate-only data quality audit
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m diabetes_ml.cgm_audit \
            --dataset shanghai_t2dm=upstream-glucose-ml/Standardized-datasets/ShanghaiT2DM \
            --dataset bris_t1d_open=upstream-glucose-ml/Standardized-datasets/Bris-T1D_Open \
            --upstream-revision "$(git -C upstream-glucose-ml rev-parse HEAD)" \
            --output cgm-audit-summary/audit-summary.json
      - name: Upload aggregate audit report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-cgm-aggregate-audit
          path: cgm-audit-summary/*.json
          if-no-files-found: ignore
          retention-days: 14
