name: Repeated-seed neural hyperparameter study

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-neural-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Run ten-seed validation-selected tuning
        run: python -m diabetes_ml.repeated_neural_tuning --output repeated-neural-tuning-results
      - name: Upload tuning results
        uses: actions/upload-artifact@v4
        with:
          name: repeated-seed-neural-tuning
          path: repeated-neural-tuning-results/
          if-no-files-found: error
          retention-days: 30
