name: Repeated-seed neural hyperparameter study

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/diabetes_ml/repeated_neural_tuning.py"
      - "src/diabetes_ml/data.py"
      - "src/diabetes_ml/neural/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_repeated_neural_tuning.py"
      - ".github/workflows/repeated-neural-tuning.yml"

permissions:
  contents: read

jobs:
  repeated-neural-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked neural dependencies
        run: uv sync --locked --no-build-isolation-package diabetes-ml --python 3.11 --extra build --extra neural
      - name: Run ten-seed validation-selected tuning
        run: uv run --locked python -m diabetes_ml.repeated_neural_tuning --output repeated-neural-tuning-results
      - name: Upload tuning results
        uses: actions/upload-artifact@v4
        with:
          name: repeated-seed-neural-tuning
          path: repeated-neural-tuning-results/
          if-no-files-found: error
          retention-days: 30
