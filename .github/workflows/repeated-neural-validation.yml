name: Repeated-seed neural validation

on:
  push:
    branches: [main]
    paths:
      - "src/diabetes_ml/repeated_neural_validation.py"
      - "src/diabetes_ml/data.py"
      - "src/diabetes_ml/neural/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/repeated-neural-validation.yml"
  pull_request:
    paths:
      - "src/diabetes_ml/repeated_neural_validation.py"
      - "src/diabetes_ml/data.py"
      - "src/diabetes_ml/neural/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/repeated-neural-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-neural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked neural dependencies
        run: uv sync --locked --no-build-isolation-package diabetes-ml --python 3.11 --extra build --extra neural
      - name: Run ten-seed neural validation
        run: uv run --locked python -m diabetes_ml.repeated_neural_validation --output repeated-neural-validation-results
      - name: Upload repeated-neural metrics and histories
        uses: actions/upload-artifact@v4
        with:
          name: repeated-seed-neural-validation
          path: repeated-neural-validation-results/
          if-no-files-found: error
          retention-days: 30
