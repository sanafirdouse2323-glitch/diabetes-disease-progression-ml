name: End-to-end notebook execution

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/notebook-execution.yml"

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install neural frameworks and notebook runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu nbconvert ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Install project
        run: pip install -e .
      - name: Execute notebooks
        run: |
          mkdir -p audit-executed
          for notebook in notebooks/01_exploration.ipynb notebooks/02_model_comparison.ipynb notebooks/03_neural_networks.ipynb; do
            jupyter nbconvert --to notebook --execute "$notebook" \
              --output "$(basename "$notebook")" \
              --output-dir audit-executed \
              --ExecutePreprocessor.timeout=900
          done
      - name: Upload executed notebooks and experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            audit-executed/
            notebook-results/
          if-no-files-found: error
          retention-days: 7
