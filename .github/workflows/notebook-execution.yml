name: End-to-end notebook execution

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "notebooks/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/notebook-execution.yml"

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked notebook and neural dependencies
        run: uv sync --locked --no-build-isolation-package diabetes-ml --python 3.11 --extra build --extra notebooks --extra neural
      - name: Execute notebooks
        run: |
          mkdir -p audit-executed
          for notebook in notebooks/01_exploration.ipynb notebooks/02_model_comparison.ipynb notebooks/03_neural_networks.ipynb; do
            uv run --locked jupyter nbconvert --to notebook --execute "$notebook" \
              --output "$(basename "$notebook")" \
              --output-dir audit-executed \
              --ExecutePreprocessor.timeout=900
          done
      - name: Upload executed notebooks and experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            audit-executed/
            notebook-results/
          if-no-files-found: error
          retention-days: 7
