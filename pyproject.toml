[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-ml"
version = "0.2.0"
description = "Tabular diabetes disease-progression regression benchmark with split-conformal uncertainty and exploratory subgroup error analysis"
authors = [{ name = "Sana Firdouse" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0"
]

[project.optional-dependencies]
neural = [
    "torch>=2.0.0",
    "tensorflow>=2.15.0"
]
demo = [
    "streamlit>=1.30.0",
    "altair>=5.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
all = [
    "torch>=2.0.0",
    "tensorflow>=2.15.0",
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
