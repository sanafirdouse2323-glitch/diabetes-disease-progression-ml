[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-ml"
version = "0.2.0"
description = "Tabular diabetes disease-progression regression benchmark with split-conformal uncertainty and exploratory subgroup error analysis"
authors = [{ name = "Sana Firdouse" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0"
]

[project.optional-dependencies]
neural = [
    "torch>=2.0.0",
    "tensorflow-cpu>=2.15.0"
]
demo = [
    "streamlit>=1.30.0",
    "altair>=5.0.0"
]
notebooks = [
    "matplotlib>=3.6.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
external-data = [
    "ucimlrepo>=0.0.7"
]
all = [
    "torch>=2.0.0",
    "tensorflow-cpu>=2.15.0",
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "matplotlib>=3.6.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ucimlrepo>=0.0.7"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]
